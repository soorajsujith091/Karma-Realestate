<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARMA Admin — Properties & CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0071E3; --blue-d:#0077ED; --accent-soft:#F0F7FF;
  --bg:#FFFFFF; --bg-soft:#F5F5F7; --ink:#1D1D1F; --ink-2:#86868B; --ink-3:#515154;
  --line:rgba(0,0,0,.1); --line-solid:#D2D2D7;
  --green:#1D9E4B; --green-soft:#E4F5EA; --red:#E03038; --red-soft:#FBE9E9;
  --amber:#B8860B; --amber-soft:#F7EBD0; --purple:#8944AB; --purple-soft:#F3E8F9;
  --r:18px; --r-sm:12px;
  --shadow-1:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --shadow-2:0 4px 20px rgba(0,0,0,.08);
  --shadow-3:0 20px 50px rgba(0,0,0,.14);
  --ease:cubic-bezier(.28,.11,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','SF Pro Text',system-ui,sans-serif;color:var(--ink);background:var(--bg-soft);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit;letter-spacing:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;letter-spacing:inherit}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;background:#fff;padding:24px}
.login-card{width:100%;max-width:380px;text-align:center;animation:rise .7s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{display:inline-flex;align-items:center;gap:10px;user-select:none}
.logo-mark{width:40px;height:40px;border-radius:11px;background:var(--ink);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.logo-txt{text-align:left;line-height:1.05}
.logo-txt b{display:block;font-size:16px;font-weight:700;letter-spacing:.4px}
.logo-txt span{font-size:9px;font-weight:600;letter-spacing:2.8px;color:var(--ink-2)}
.login h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:28px 0 6px}
.login p{color:var(--ink-2);font-size:13.5px;margin-bottom:28px}
.fld{margin-bottom:12px;text-align:left}
.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line-solid);border-radius:12px;padding:11px 14px;font-size:14px;transition:border-color .15s,box-shadow .15s;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:14px;padding:11px 20px;border-radius:999px;transition:transform .15s,background .2s,border-color .2s;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;border:1px solid var(--line-solid);color:var(--ink)}
.btn-ghost:hover{border-color:#A8A8AD}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-danger{background:var(--red-soft);color:var(--red)}
.login-note{margin-top:18px;font-size:12px;color:var(--ink-2);background:var(--bg-soft);border-radius:11px;padding:10px 14px}

/* ---------- App shell ---------- */
.app{display:none;min-height:100vh}
body[data-auth="in"] .app{display:grid;grid-template-columns:232px 1fr}
body[data-auth="in"] .login{display:none}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{margin:4px 8px 22px}
.s-label{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);padding:14px 12px 6px}
.s-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;font-weight:500;font-size:13.5px;color:var(--ink-3);transition:background .15s,color .15s;text-align:left;width:100%;position:relative}
.s-item:hover{background:var(--bg-soft);color:var(--ink)}
.s-item.on{background:var(--accent-soft);color:var(--blue);font-weight:600}
.s-item svg{flex:none}
.s-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.side-foot .avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.side-foot b{display:block;font-size:12.5px;font-weight:600}
.side-foot span{font-size:11px;color:var(--ink-2)}
.side-foot button{margin-left:auto;color:var(--ink-2);font-size:12px}
.side-foot button:hover{color:var(--red)}

.main{padding:0 0 60px;min-width:0}
.topbar{position:sticky;top:0;z-index:40;background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:-.02em}
.topbar p{font-size:12px;color:var(--ink-2);margin-top:1px}
.content{padding:24px 28px;max-width:1200px}

/* stat cards */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow-1);transition:transform .3s var(--ease),box-shadow .3s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.stat .s-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.stat .s-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.025em}
.stat span{font-size:12px;color:var(--ink-2)}
.stat .delta{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
.delta.up{background:var(--green-soft);color:var(--green)}
.delta.warn{background:var(--red-soft);color:var(--red)}

/* panels & tables */
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow-1);overflow:hidden;margin-bottom:20px}
.panel-hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-hd h3{font-size:15px;font-weight:700;letter-spacing:-.015em}
.panel-hd p{font-size:12px;color:var(--ink-2);margin-top:1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s;cursor:pointer}
.tbl tbody tr:hover{background:#FAFAFC}
.td-main b{display:block;font-weight:600;font-size:13.5px}
.td-main span{font-size:11.5px;color:var(--ink-2)}
.thumb{width:44px;height:34px;border-radius:8px;object-fit:cover;background:linear-gradient(135deg,#DCE8F5,#B9CFEA)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.blue{background:var(--accent-soft);color:var(--blue)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.gray{background:var(--bg-soft);color:var(--ink-3)}
.pill.purple{background:var(--purple-soft);color:var(--purple)}
select.pill-sel{border:1px solid var(--line-solid);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:500;background:#fff;cursor:pointer}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--bg-soft);color:var(--ink)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.search-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line-solid);border-radius:999px;padding:7px 14px;background:#fff;min-width:220px}
.search-in input{border:none;outline:none;flex:1;font-size:13px;background:none}
.search-in svg{color:var(--ink-2);flex:none}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-solid);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:500;background:#fff;transition:all .15s}
.fchip:hover{border-color:#A8A8AD}
.fchip.on{border-color:var(--blue);background:var(--accent-soft);color:var(--blue);font-weight:600}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* drawer */
.drawer-wrap{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{width:min(480px,100%);background:#fff;height:100%;overflow-y:auto;box-shadow:var(--shadow-3);animation:slideIn .4s var(--ease)}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.drawer-hd{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:5}
.drawer-hd b{font-size:15px;font-weight:700}
.drawer-bd{padding:22px}
.modal-x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--bg-soft);color:var(--ink-3);transition:background .15s}
.modal-x:hover{background:#E8E8ED}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:13px;margin-bottom:20px}
.kv dt{color:var(--ink-2)}
.kv dd{font-weight:500}
.act-log{border-left:2px solid var(--line-solid);margin-left:6px;padding-left:18px;display:grid;gap:14px}
.act{position:relative;font-size:13px}
.act::before{content:'';position:absolute;left:-23.5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--line-solid)}
.act b{font-weight:600}
.act .when{display:block;font-size:11px;color:var(--ink-2);margin-top:2px}
.note-box{display:flex;gap:8px;margin-top:16px}
.note-box input{flex:1;border:1px solid var(--line-solid);border-radius:999px;padding:9px 16px;font-size:13px}
.note-box input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(0,113,227,.15)}

/* property form modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;padding:20px;animation:fadeIn .2s}
.modal{background:#fff;border-radius:24px;width:100%;max-width:640px;box-shadow:var(--shadow-3);animation:modalIn .4s var(--ease);max-height:92vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.modal-hd{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);padding:17px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:5;border-radius:24px 24px 0 0}
.modal-hd b{font-size:15px;font-weight:700}
.modal-bd{padding:24px}
.frm-sec{margin-bottom:22px}
.frm-sec h4{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.frm-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.frm-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.conv-note{font-size:11.5px;color:var(--blue);font-weight:500;margin:-6px 0 12px;min-height:15px}
.check-line{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;padding:6px 0;cursor:pointer}
.check-line input{accent-color:var(--blue);width:15px;height:15px}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.photo-tile{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#DCE8F5,#B9CFEA)}
.photo-tile img{width:100%;height:100%;object-fit:cover}
.photo-tile .cover-tag{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.9);font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;color:var(--blue)}
.photo-tile .p-acts{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;justify-content:center;gap:4px;padding:16px 4px 6px;opacity:0;transition:opacity .2s}
.photo-tile:hover .p-acts{opacity:1}
.photo-tile .p-acts button{color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px}
.photo-tile .p-acts button:hover{background:rgba(255,255,255,.22)}
.photo-add{aspect-ratio:4/3;border:1.5px dashed var(--line-solid);border-radius:12px;display:grid;place-items:center;color:var(--ink-2);font-size:12px;font-weight:500;transition:all .15s;cursor:pointer}
.photo-add:hover{border-color:var(--blue);color:var(--blue);background:var(--accent-soft)}

/* docs */
.doc-row{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line)}
.doc-row:last-child{border-bottom:none}
.doc-ic{width:38px;height:38px;border-radius:10px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex:none}
.doc-ic.img{background:var(--accent-soft);color:var(--blue)}
.doc-main{flex:1;min-width:0}
.doc-main b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-main span{font-size:11.5px;color:var(--ink-2)}
.wm-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--green);background:var(--green-soft);padding:3px 9px;border-radius:999px}
.remarks{background:#FFFBEB;border:1px solid #F3E3B3;border-radius:14px;padding:14px 16px;margin:16px 20px}
.remarks h5{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.remarks textarea{width:100%;border:none;background:none;resize:vertical;min-height:44px;font-size:13px;color:var(--ink-3);outline:none}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:rgba(29,29,31,.92);backdrop-filter:blur(12px);color:#fff;font-weight:500;font-size:13.5px;padding:12px 22px;border-radius:999px;z-index:300;transition:transform .45s var(--ease);box-shadow:var(--shadow-3);max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.view-fade{animation:vIn .35s var(--ease)}
@keyframes vIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  body[data-auth="in"] .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-100%);transition:transform .35s var(--ease);width:240px}
  .side.open{transform:none;box-shadow:var(--shadow-3)}
  .menu-btn{display:grid !important}
  .content{padding:18px 16px}
  .topbar{padding:12px 16px}
  .frm-2,.frm-3{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:repeat(3,1fr)}
  .kv{grid-template-columns:90px 1fr}
}
.menu-btn{display:none;width:36px;height:36px;border-radius:10px;place-items:center;background:#fff;border:1px solid var(--line-solid)}
</style>
</head>
<body data-auth="out">

<!-- ============ LOGIN ============ -->
<div class="login">
  <div class="login-card">
    <div class="logo"><div class="logo-mark">K</div><div class="logo-txt"><b>KARMA</b><span>ADMIN PANEL</span></div></div>
    <h1>Sign in to Admin</h1>
    <p>One shared login for the KARMA team.</p>
    <div class="fld"><label>Email</label><input id="lgEmail" type="email" placeholder="team@karmarealestate.in" value="team@karmarealestate.in"></div>
    <div class="fld"><label>Password</label><input id="lgPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-blue" style="width:100%;padding:13px" onclick="doLogin()">Sign in</button>
    <div class="login-note">Demo mode — enter any password to explore the panel.</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><div class="logo-mark">K</div><div class="logo-txt"><b>KARMA</b><span>ADMIN PANEL</span></div></div>
    <div class="s-label">Manage</div>
    <button class="s-item on" data-v="dash" onclick="nav('dash')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg> Dashboard</button>
    <button class="s-item" data-v="props" onclick="nav('props')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10"/></svg> Properties</button>
    <button class="s-item" data-v="crm" onclick="nav('crm')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.85M16.5 3.1a4 4 0 0 1 0 7.8"/></svg> Leads &amp; CRM <span class="s-badge" id="leadBadge">3</span></button>
    <button class="s-item" data-v="docs" onclick="nav('docs')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5M9 14h6M9 17h4"/></svg> Confidential docs</button>
    <div class="s-label">Coming later</div>
    <button class="s-item" onclick="toast('Bulk spreadsheet import — planned (Section 9.2)')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Bulk import</button>
    <button class="s-item" onclick="toast('Analytics deferred to Phase 2 (Section 10.7)')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 20h18M6 16v-5m5 5V8m5 8v-3m5 3V5"/></svg> Analytics</button>
    <div class="side-foot">
      <div class="avatar">KT</div>
      <div><b>KARMA Team</b><span>Shared admin login</span></div>
      <button onclick="doLogout()" title="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div><h1 id="tbTitle">Dashboard</h1><p id="tbSub">Saturday, 18 July 2026 · Kannur</p></div>
      </div>
      <button class="btn btn-blue btn-sm" onclick="openPropForm()">+ Add property</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

function nav(v){A.view=v;

function genPdf(t){toast(`⏳ Generating branded PDF for “${t}”…`,1500);setTimeout(()=>toast('✓ PDF ready — KARMA watermark applied. Download & share on WhatsApp.',3400),1600)}

/* ---------- CRM ---------- */

  const F=['All','New','Contacted','Interested','Not Interested','Closed'];
  let list=LEADS.filter(l=>(A.crmFilter==='All'||l.status===A.crmFilter));
  if(A.crmQ){const q=A.crmQ.toLowerCase();list=list.filter(l=>l.name.toLowerCase().includes(q)||l.phone.includes(q)||l.props.join(' ').toLowerCase().includes(q))}
  return `
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px">
    <div class="chip-row">${F.map(f=>`<button class="fchip ${A.crmFilter===f?'on':''}" onclick="A.crmFilter='${f}';render()">${f}${f==='All'?` · ${LEADS.length}`:''}</button>`).join('')}</div>
    <div class="search-in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search name, phone, property" value="${esc(A.crmQ)}" oninput="A.crmQ=this.value;render();this.focus();this.setSelectionRange(99,99)"></div>
  </div>
  <div class="panel">
    ${list.length?`<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Customer</th><th>First seen</th><th>Properties viewed</th><th>Source</th><th>Status</th></tr></thead>
    <tbody>${list.map(l=>`<tr onclick="openLead(${l.id})">
      <td class="td-main"><b>${esc(l.name)}</b><span>${l.phone} · ${l.loc}</span></td>
      <td style="font-size:12.5px;color:var(--ink-3);white-space:nowrap">${l.first}</td>
      <td style="font-size:12.5px;color:var(--ink-3)">${esc(l.props[0])}${l.props.length>1?` <span style="color:var(--ink-2)">+${l.props.length-1} more</span>`:''}</td>
      <td><span class="pill ${l.src==='Site visit request'?'amber':'gray'}">${l.src}</span></td>
      <td>${statusPill(l.status)}</td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty"><b>No leads match</b>Try a different status filter or search term.</div>`}
  </div>
  <p style="font-size:12px;color:var(--ink-2);padding:0 4px">Leads appear here the moment a customer verifies OTP or requests a site visit — no SMS/WhatsApp push costs (Section 6.3). The red badge on the sidebar is your free in-app alert.</p>`;
}
function openLead(id){
  const l=LEADS.find(x=>x.id===id);
  $('modalRoot').innerHTML=`
  <div class="drawer-wrap" id="dw" onclick="if(event.target.id==='dw')closeModal()">
    <div class="drawer">
      <div class="drawer-hd"><b>${esc(l.name)}</b><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="drawer-bd">
        <dl class="kv">
          <dt>Mobile</dt><dd>${l.phone} <a href="tel:+91${l.phone.replace(/\s/g,'')}" style="color:var(--blue);font-weight:600;text-decoration:none;margin-left:6px">Call</a> <a target="_blank" rel="noopener" href="https://wa.me/91${l.phone.replace(/\s/g,'')}" style="color:var(--green);font-weight:600;text-decoration:none;margin-left:4px">WhatsApp</a></dd>
          <dt>Location</dt><dd>${l.loc}, Kannur</dd>
          <dt>First seen</dt><dd>${l.first}</dd>
          <dt>Source</dt><dd>${l.src}</dd>
          <dt>Status</dt><dd><select class="pill-sel" onchange="setLeadStatus(${l.id},this.value)">${['New','Contacted','Interested','Not Interested','Closed'].map(s=>`<option ${l.status===s?'selected':''}>${s}</option>`).join('')}</select></dd>
        </dl>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px">Properties unlocked · ${l.props.length}</h4>
        <div style="display:grid;gap:6px;margin-bottom:22px">${l.props.map(p=>`<div style="background:var(--bg-soft);border-radius:11px;padding:10px 14px;font-size:13px;font-weight:500">${esc(p)}</div>`).join('')}</div>
        <h4 style="font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px">Activity & notes</h4>
        <div class="act-log" id="actLog">${l.log.map(a=>`<div class="act"><b>${esc(a.t)}</b><span class="when">${a.w}</span></div>`).join('')}</div>
        <div class="note-box"><input id="noteIn" placeholder="Add a note — e.g. “Called, follow up Tuesday”" onkeydown="if(event.key==='Enter')addNote(${l.id})"><button class="btn btn-blue btn-sm" onclick="addNote(${l.id})">Add</button></div>
      </div>
    </div>
  </div>`;
}
function setLeadStatus(id,s){const l=LEADS.find(x=>x.id===id);l.status=s;l.log.unshift({t:'Status changed to '+s,w:'18 Jul, just now'});toast(`${esc(l.name)} marked ${s}`);render()}
function addNote(id){
  const inp=$('noteIn');const v=inp.value.trim();if(!v)return;
  const l=LEADS.find(x=>x.id===id);
  l.log.unshift({t:'Note: '+v,w:'18 Jul, just now'});
  $('actLog').innerHTML=l.log.map(a=>`<div class="act"><b>${esc(a.t)}</b><span class="when">${a.w}</span></div>`).join('');
  inp.value='';toast('Note saved to the lead record');
}
function closeModal(){$('modalRoot').innerHTML=''}

          <button class="icon-btn" title="View (logged)" onclick="logAccess('Viewed','${esc(d.n)}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>

        </div>
      </div>`).join(''):`<div class="empty"><b>No documents yet</b>Upload title deeds, EC, tax receipts — watermarking is automatic.</div>`}
    <div class="remarks"><h5><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg> Internal remarks — admin only</h5>
      <textarea onchange="REMARKS[${p.id}]=this.value;toast('Internal remarks saved — never shown publicly')" placeholder="e.g. Owner open to 5% negotiation…">${esc(REMARKS[p.id]||'')}</textarea></div>
  </div>
  <div class="panel">
    <div class="panel-hd"><div><h3>Document access log</h3><p>Every view & download is recorded — even with one shared login</p></div></div>
    <table class="tbl"><thead><tr><th>When</th><th>Action</th></tr></thead>
    <tbody id="accessRows">${ACCESS_LOG.map(a=>`<tr style="cursor:default"><td style="white-space:nowrap;color:var(--ink-2)">${a.w}</td><td style="font-weight:500">${esc(a.t)}</td></tr>`).join('')}</tbody></table>
  </div>`;
}
function logAccess(act,doc){ACCESS_LOG.unshift({w:'18 Jul, just now',t:`${act} “${doc}”`});toast(`${act} — recorded in the access log`);render()}
function uploadDoc(pid){
  (DOCS[pid]=DOCS[pid]||[]).unshift({n:'New document '+(DOCS[pid].length+1)+'.pdf',s:'1.2 MB · uploaded just now',k:'pdf'});
  ACCESS_LOG.unshift({w:'18 Jul, just now',t:'Uploaded new document — “KARMA REAL ESTATE — CONFIDENTIAL · 18 Jul 2026” watermark applied'});
  toast('✓ Uploaded & watermarked automatically');render();
}

/* ---------- Property form ---------- */
function openPropForm(id){
  const p=id?PROPS.find(x=>x.id===id):null;
  $('modalRoot').innerHTML=`
  <div class="overlay" id="ovl" onclick="if(event.target.id==='ovl')closeModal()">
    <div class="modal">
      <div class="modal-hd"><b>${p?'Edit property':'Add property'}</b><button class="modal-x" onclick="closeModal()">✕</button></div>
      <div class="modal-bd">
        <div class="frm-sec"><h4>Basics</h4>
          <div class="fld"><label>Title</label><input id="pfTitle" placeholder="e.g. 2BHK Flat in Thottada" value="${p?esc(p.title):''}"></div>
          <div class="frm-3">
            <div class="fld"><label>Property type</label><select id="pfType">${['Land','House','Flat','Warehouse','Commercial'].map(t=>`<option ${p&&p.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
            <div class="fld"><label>Purpose</label><select>${['Sale','Rent','Lease'].map(t=>`<option ${p&&p.purpose===t?'selected':''}>${t}</option>`).join('')}</select></div>
            <div class="fld"><label>Locality</label><select>${['Thottada','Kannur City','Payyambalam','Chovva','Pallikkunnu','Kakkad','Azhikode','Thalassery','Muzhappilangad','Edakkad'].map(t=>`<option ${p&&p.loc===t?'selected':''}>${t}</option>`).join('')}</select></div>
          </div>
          <div class="frm-2">
            <div class="fld"><label>Price (₹, lakhs)</label><input type="number" placeholder="e.g. 66" value="${p?'':''}"></div>
            <div class="fld"><label>Price basis</label><select><option>One-time (sale)</option><option>Per month</option><option>Per year</option></select></div>
          </div>
          <label class="check-line"><input type="checkbox" checked> Price negotiable</label>
        </div>
        <div class="frm-sec"><h4>Area — Kerala units</h4>
          <div class="frm-2">
            <div class="fld"><label>Land area</label><input id="pfArea" type="number" placeholder="e.g. 12" oninput="convUnits()"></div>
            <div class="fld"><label>Unit</label><select id="pfUnit" onchange="convUnits()"><option>Cent</option><option>Acre</option><option>Sq. ft</option></select></div>
          </div>
          <div class="conv-note" id="convNote"></div>
          <div class="frm-2">
            <div class="fld"><label>Building area (sq.ft)</label><input type="number" placeholder="If applicable"></div>
            <div class="fld"><label>Bedrooms / Bathrooms</label><input placeholder="e.g. 3 / 2"></div>
          </div>
        </div>
        <div class="frm-sec"><h4>Photos & media — self-hosted, auto-optimized</h4>
          <div class="photo-grid" id="photoGrid">
            <div class="photo-tile"><span class="cover-tag">COVER</span><div class="p-acts"><button onclick="toast('Reordered')">←</button><button onclick="toast('Reordered')">→</button></div></div>
            <div class="photo-tile"><div class="p-acts"><button onclick="toast('Set as cover photo')">Cover</button><button onclick="toast('Photo removed')">✕</button></div></div>
            <div class="photo-tile"><div class="p-acts"><button onclick="toast('Set as cover photo')">Cover</button><button onclick="toast('Photo removed')">✕</button></div></div>
            <button class="photo-add" onclick="toast('Upload — auto-compressed to WebP in 3 sizes, served via CDN (Section 7.3)')">+ Add</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn btn-ghost btn-sm" onclick="toast('Video upload — transcoded to web format on upload')">+ Video</button>
            <button class="btn btn-ghost btn-sm" onclick="toast('360° virtual tour upload/embed — per property (Section 7.1)')">+ Virtual tour</button>
          </div>
        </div>
        <div class="frm-sec"><h4>The honest view</h4>
          <div class="fld"><label>Pros (one per line)</label><textarea rows="3" placeholder="Tar road frontage&#10;Clear single-owner title"></textarea></div>
          <div class="fld"><label>Cons (one per line)</label><textarea rows="2" placeholder="Slight slope on western edge"></textarea></div>
        </div>
        <div class="frm-sec"><h4>Legal — optional fields</h4>
          <div class="frm-2">
            <div class="fld"><label>K-RERA number (optional)</label><input placeholder="Shown only if entered" value="${p?esc(p.rera):''}"></div>
            <div class="fld"><label>Land classification (optional)</label><select><option value="">— Not specified —</option><option ${p&&p.cls.startsWith('Puray')?'selected':''}>Purayidam</option><option>Nikathari</option><option ${p&&p.cls.startsWith('Nilam')?'selected':''}>Nilam / Wetland — converted</option><option>Nilam / Wetland — not converted</option></select></div>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-blue" style="flex:1" onclick="saveProp(${p?p.id:'null'})">${p?'Save changes':'Publish listing'}</button>
          <button class="btn btn-ghost" onclick="toast('Preview — opens the listing exactly as customers see it')">Preview</button>
        </div>
        <p style="font-size:11px;color:var(--ink-2);text-align:center;margin-top:12px">No approval workflow — whatever the team publishes goes live immediately (confirmed, Section 1).</p>
      </div>
    </div>
  </div>`;
  convUnits();
}
function convUnits(){
  const v=parseFloat($('pfArea')?.value),u=$('pfUnit')?.value,n=$('convNote');if(!n)return;
  if(!v){n.textContent='1 Cent = 435.6 sq.ft · 1 Acre = 100 Cents';return}
  if(u==='Cent')n.textContent=`= ${(v*435.6).toLocaleString('en-IN')} sq.ft${v>=100?` · ${(v/100).toLocaleString('en-IN')} acre${v>=200?'s':''}`:''}`;
  if(u==='Acre')n.textContent=`= ${(v*100).toLocaleString('en-IN')} cents · ${(v*43560).toLocaleString('en-IN')} sq.ft`;
  if(u==='Sq. ft')n.textContent=`= ${(v/435.6).toLocaleString('en-IN',{maximumFractionDigits:2})} cents`;
}
function saveProp(id){
  if(id){toast('✓ Changes saved & live on the public site')}
  else{
    const t=$('pfTitle').value.trim()||'Untitled property';
    PROPS.unshift({id:Date.now(),title:t,type:$('pfType').value,purpose:'Sale',price:'—',loc:'Thottada',status:'Available',pub:true,listed:'18 Jul 2026',views:0,leads:0,rera:'',cls:''});
    toast(`✓ “${esc(t)}” published — live on the public site immediately`);
  }
  closeModal();if(A.view!=='props')nav('props');else render();
}

updateBadge();render();
</script>
